name: Publish Docker image (alpha)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TENCENT_REGISTRY: ccr.ccs.tencentyun.com
  TENCENT_NAMESPACE: im-lee
  TENCENT_IMAGE: new-api

on:
  push:
    branches:
      - alpha
      - lee
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

jobs:
  build_amd64:
    name: Build & push amd64 to Tencent CCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Resolve image tag
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "$SHORT_SHA" > VERSION
          echo "value=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "VERSION=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Publishing version: $SHORT_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Tencent CCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.TENCENT_REGISTRY }}/${{ env.TENCENT_NAMESPACE }}/${{ env.TENCENT_IMAGE }}

      - name: Build & push amd64
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.TENCENT_REGISTRY }}/${{ env.TENCENT_NAMESPACE }}/${{ env.TENCENT_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.TENCENT_REGISTRY }}/${{ env.TENCENT_NAMESPACE }}/${{ env.TENCENT_IMAGE }}:alpha-amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Output digest
        run: |
          echo "### Tencent CCR Image Digest (amd64)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.TENCENT_REGISTRY }}/${{ env.TENCENT_NAMESPACE }}/${{ env.TENCENT_IMAGE }}:${{ steps.version.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
