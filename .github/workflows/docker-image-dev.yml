name: Publish Docker image (dev)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

jobs:
  build_amd64:
    name: Build & push amd64 to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Resolve image tag
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "$SHORT_SHA" > VERSION
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "value=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "VERSION=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Publishing version: $SHORT_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ steps.version.outputs.repository }}

      - name: Build & push amd64
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ steps.version.outputs.repository }}:dev
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Output digest
        run: |
          echo "### GHCR Image Digest (amd64)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.version.outputs.repository }}:${{ steps.version.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
